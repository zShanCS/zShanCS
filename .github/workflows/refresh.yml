name: refresh profile assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional read-only PAT so private org PRs/reviews/repos stay counted
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_ORGS: ${{ secrets.PROFILE_ORGS }}
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets stats.json
          git diff --cached --quiet || git commit -m "chore: refresh profile assets"
          git push
